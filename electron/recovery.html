<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recovery PIN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Lấy theme từ preload
      document.documentElement.setAttribute("data-theme", window.theme.value);
    </script>
  </head>
  <body class="flex items-center justify-center h-screen bg-base-200 w-full">
    <div class="card bg-base-100 card-bordered">
      <div class="card-body space-y-4 text-center">
        <div class="flex justify-between items-center">
          <h2 class="card-title">Khôi phục PIN</h2>
          <a href="unlock.html" class="btn btn-sm btn-ghost">Quay lại</a>
        </div>

        <!-- Step indicator -->
        <ul class="steps w-full" id="stepIndicator">
          <li class="step step-primary">Nhập Recovery Key</li>
          <li class="step">PIN mới</li>
          <li class="step">Xác nhận PIN</li>
        </ul>

        <!-- Bước 1: nhập recovery key -->
        <div id="step1">
          <input
            id="recoveryKey"
            type="text"
            placeholder="Nhập Recovery Key"
            class="input input-bordered w-full"
          />
          <div class="flex justify-between gap-4 mt-4">
            <button id="btnVerifyKey" class="btn btn-primary mt-2 flex-1">
              Xác minh
            </button>
          </div>
        </div>

        <!-- Bước 2: nhập pin mới -->
        <div id="step2" class="hidden">
          <div class="flex justify-center gap-2">
            <input
              maxlength="1"
              class="pin-input input input-bordered w-12 text-center text-lg"
            />
            <input
              maxlength="1"
              class="pin-input input input-bordered w-12 text-center text-lg"
            />
            <input
              maxlength="1"
              class="pin-input input input-bordered w-12 text-center text-lg"
            />
            <input
              maxlength="1"
              class="pin-input input input-bordered w-12 text-center text-lg"
            />
          </div>
          <button id="btnSetPin" class="btn btn-primary w-full mt-4">
            Tiếp tục
          </button>
        </div>

        <!-- Bước 3: xác nhận pin mới -->
        <div id="step3" class="hidden">
          <div class="flex justify-center gap-2">
            <input
              maxlength="1"
              class="confirm-input input input-bordered w-12 text-center text-lg"
            />
            <input
              maxlength="1"
              class="confirm-input input input-bordered w-12 text-center text-lg"
            />
            <input
              maxlength="1"
              class="confirm-input input input-bordered w-12 text-center text-lg"
            />
            <input
              maxlength="1"
              class="confirm-input input input-bordered w-12 text-center text-lg"
            />
          </div>
          <button id="btnConfirmPin" class="btn btn-success w-full mt-4">
            Xác nhận
          </button>
        </div>

        <!-- Thông báo lỗi -->
        <p id="errorMsg" class="text-red-500"></p>
      </div>
    </div>

    <script>
      const ipcRenderer = window.electron.ipcRenderer;

      const stepIndicator = document.getElementById("stepIndicator").children;
      const step1 = document.getElementById("step1");
      const step2 = document.getElementById("step2");
      const step3 = document.getElementById("step3");
      const errorMsg = document.getElementById("errorMsg");

      const btnVerifyKey = document.getElementById("btnVerifyKey");
      const btnSetPin = document.getElementById("btnSetPin");
      const btnConfirmPin = document.getElementById("btnConfirmPin");

      const recoveryKeyInput = document.getElementById("recoveryKey");

      const newPinInputs = document.querySelectorAll(".pin-input");
      const confirmPinInputs = document.querySelectorAll(".confirm-input");

      // Helper: update steps UI
      function setStep(activeIndex) {
        Array.from(stepIndicator).forEach((li, i) => {
          if (i < activeIndex) li.classList.add("step-primary");
          else li.classList.remove("step-primary");
        });
      }

      // Helper: ghép 4 input thành PIN string
      function getPin(inputs) {
        return Array.from(inputs)
          .map((inp) => inp.value)
          .join("");
      }

      // Auto move cursor
      function setupAutoTab(inputs) {
        inputs.forEach((inp, idx) => {
          inp.addEventListener("input", () => {
            if (inp.value && idx < inputs.length - 1) {
              inputs[idx + 1].focus();
            }
          });
          inp.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && !inp.value && idx > 0) {
              inputs[idx - 1].focus();
            }
          });
        });
      }
      setupAutoTab(newPinInputs);
      setupAutoTab(confirmPinInputs);

      // Bước 1: xác minh recovery key
      btnVerifyKey.addEventListener("click", () => {
        const key = recoveryKeyInput.value.trim();

        ipcRenderer.on("check-recover-key-result", (success) => {
          if (success) {
            errorMsg.innerText = "";
            step1.classList.add("hidden");
            step2.classList.remove("hidden");
            setStep(2);
            newPinInputs[0].focus();
          } else {
            errorMsg.innerText = "Recovery key không hợp lệ!";
          }
        });

        ipcRenderer.send("check-recover-key", key);
      });

      // Bước 2: nhập pin mới
      btnSetPin.addEventListener("click", () => {
        const pin = getPin(newPinInputs);

        if (pin.length !== 4 || !/^\d+$/.test(pin)) {
          errorMsg.innerText = "PIN phải là 4 chữ số!";
          return;
        }

        errorMsg.innerText = "";
        step2.classList.add("hidden");
        step3.classList.remove("hidden");
        setStep(3);
        confirmPinInputs[0].focus();
      });

      // Bước 3: xác nhận pin
      btnConfirmPin.addEventListener("click", () => {
        const pin = getPin(newPinInputs);
        const confirm = getPin(confirmPinInputs);

        if (pin !== confirm) {
          errorMsg.innerText = "Mã PIN không trùng khớp!";
          return;
        }

        ipcRenderer.on("forgot-pin-result", (success) => {
          if (success) {
            errorMsg.classList.remove("text-red-500");
            errorMsg.classList.add("text-green-500");
            errorMsg.innerText = "Đặt mã PIN mới thành công.";
            step3.classList.add("hidden");
          } else {
            errorMsg.innerText = "Có lỗi xảy ra, thử lại sau.";
          }
        });

        ipcRenderer.send("forgot-pin", pin);
      });
    </script>
  </body>
</html>
